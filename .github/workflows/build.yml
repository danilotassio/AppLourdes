name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - name: Diagnostico
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)
          ls -l $APK
          $BT/apksigner verify --verbose $APK || true
          $BT/aapt2 dump badging $APK | head -40 || true
      - uses: actions/upload-artifact@v4
        with: { name: Lourdinha-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lourdinha.apk
          gh release delete apk-layout --cleanup-tag --yes || true
          gh release create apk-layout Lourdinha.apk --title "Lourdinha - APK layout moderno" --notes "Build de ${{ github.sha }}" --target ${{ github.sha }}
