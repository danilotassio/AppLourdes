<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remédios da Lourdinha</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#111;min-height:100vh}
#top{padding:10px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#F8D7E3;color:#5b2340;font-size:22px;font-weight:bold}
#top .tt{text-align:center;font-weight:bold}
#top .rt{justify-self:end;display:flex;align-items:center}
#gear{background:transparent;color:#5b2340;font-size:26px;padding:0 10px;flex:none}
#clock{font-size:22px;font-weight:bold;text-align:center;line-height:1.1}#clock small{display:block;font-size:13px}
#main{padding:12px}
.card{border-radius:18px;padding:18px;margin-bottom:12px;border:4px solid rgba(0,0,0,.25)}
.big{font-size:44px;font-weight:bold;text-align:center;margin:4px 0}
.sub{font-size:22px;text-align:center;margin-bottom:8px}
.med{font-size:30px;margin:10px 0;line-height:1.15}
.btns{display:flex;gap:10px;margin-top:14px}
button{border:0;border-radius:16px;font-size:30px;font-weight:bold;padding:22px 8px;flex:1;color:#fff}
#ok{background:#1e8e3e}#no{background:#c5221f}
.small{font-size:18px;padding:12px;background:#ddd;color:#111;border-radius:12px;font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label{font-size:20px;display:flex;align-items:center;gap:10px}
input[type=checkbox]{width:28px;height:28px;accent-color:#1e8e3e}
table{width:100%;border-collapse:collapse;font-size:18px;background:#fff}
td,th{border:1px solid #999;padding:6px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:bold}
#alarmbar{display:none}
#callbtn{background:#1e8e3e;color:#fff;flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:bold;padding:12px;border-radius:12px;text-align:center}
#callbtn{line-height:21px}#callbtn .spk{margin:0;flex:none;font-size:16px;line-height:21px;padding:0 8px;border-radius:8px}#copy{line-height:21px}
#confirm,#warn{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center;padding:20px}
#confirm .box,#warn .box{background:#fff;border-radius:20px;padding:24px;width:100%;text-align:center}
#confirm .q,#warn .q{font-size:34px;font-weight:bold;margin-bottom:6px}
#gear{background:none;color:#fff;font-size:26px;padding:0 8px;flex:none}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;overflow:auto;padding:14px;z-index:50}
.spk{background:#1F3864;color:#fff;font-size:26px;padding:6px 12px;border-radius:12px;flex:none;margin-right:8px}
.medrow{display:flex;align-items:center;margin:12px 0}
.mb{display:flex;flex-direction:column;gap:6px;flex:none;margin-left:8px}
.tk,.ac{font-size:20px;padding:10px 12px;border-radius:12px;flex:none}
.tk{background:#f5c400;color:#111}
.tk.on{background:#1e8e3e;color:#fff}
.medrow.out{background:#ffd6d6;border:3px solid #c5221f;border-radius:12px;padding:6px}
.ac{background:#e0e0e0;color:#111}
.ac.on{background:#c5221f;color:#fff}
#next{display:flex;gap:8px}
.dg{flex:1;border:2px solid #999;border-radius:12px;padding:8px;background:#fafafa;min-width:0}
.dg h4{margin:0 0 6px;font-size:16px;text-align:center;color:#1F3864}
.ni{display:flex;align-items:center;justify-content:space-between;margin:5px 0;font-size:16px}
.ni.past{opacity:.6}
.ni{flex-wrap:nowrap;gap:4px}
.ni .pill{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;padding:2px 6px}
.ni input{flex:none}
.dg{padding:6px}
.ni .spk{font-size:18px;padding:3px 8px;margin:0;flex:none}
.ni input{width:24px;height:24px;flex:none;margin-left:6px}
#pw{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:99;align-items:center;justify-content:center}
#pw div.b{background:#fff;border-radius:18px;padding:20px;width:85%}
#pwi{font-size:34px;width:100%;padding:10px;text-align:center}
</style>
</head>
<body>
<div id="top"><div></div><div class="tt">Remédios da Lourdinha</div><div class="rt"><button id="gear">⚙</button><div id="clock">--:--</div></div></div>
<div id="pw"><div class="b"><div class="sub" id="pwt">Senha</div><input id="pwi" type="password" inputmode="numeric"><div class="btns"><button class="small" id="pwc" style="flex:1">Cancelar</button><button id="pwo" style="background:#1F3864;flex:1;font-size:24px">OK</button></div></div></div>
<div id="main">
  <div id="confirm"><div class="box"><div class="medrow" style="justify-content:center"><div class="q" style="margin:0">Ligar para Anne Filha?</div><button class="spk" id="spkc" style="margin:0 0 0 10px">🔊</button></div><div class="btns"><button id="callyes" style="background:#1e8e3e">✅ Sim</button><button id="callno" style="background:#c5221f">❌ Não</button></div></div></div>
  <div id="warn"><div class="box"><div class="q" id="warnt">Faltam remédios!</div><div id="warnl" style="font-size:26px;margin:10px 0"></div><button id="warnok" style="background:#1F3864;width:100%">OK</button></div></div>
  <div id="appt" class="card" style="background:#fff8e1;border-color:#f57c00"><div class="medrow" style="margin:0"><button class="spk" id="spkappt" style="margin:0 10px 0 0">🔊</button><div style="flex:1"><div style="font-size:22px;font-weight:bold;color:#e65100">🩺 Próxima consulta</div><div id="apptl" style="font-size:19px;margin-top:4px"></div></div></div></div>
  <div id="outcard" class="card" style="display:none;background:#ffe5e5;border-color:#c5221f"><div class="medrow" style="margin:0 0 4px"><button class="spk" id="spkout" style="margin:0 10px 0 0">🔊</button><b style="color:#c5221f;font-size:22px">⚠ Remédios que acabaram</b></div><div id="outl"></div><div class="row"><button class="small" id="shout" style="background:#25D366;color:#fff;font-weight:bold">Compartilhar lista (WhatsApp)</button></div></div>
  <div id="sound" style="display:none"></div>
  <div id="now"></div>
  <div class="card" style="background:#fff">
    <div class="medrow" style="margin:0"><label style="flex:1"><input type="checkbox" id="qt"><span>Dias pós-quimio. Incluir remédios de enjoo. <b id="qtd" style="color:#c5221f"></b></span></label><button class="spk" id="spkqt" style="margin:0 0 0 8px">🔊</button></div>
    <div id="adm" style="display:none"><div class="row"><button class="small" id="enable"></button></div><div class="row"><button class="small" id="test">Testar alarme</button><button class="small" id="stop">Parar música</button></div><div class="row"><button class="small" id="mealsw"></button></div><div class="row"><button class="small" id="tsrc"></button></div><div class="row" style="align-items:center"><label style="font-size:18px;flex:1">☀️ Café da manhã <input type="time" id="mt0" style="font-size:20px"></label></div><div class="row"><label style="font-size:18px;flex:1">🍽️ Almoço <input type="time" id="mt1" style="font-size:20px"></label></div><div class="row"><label style="font-size:18px;flex:1">🌙 Janta <input type="time" id="mt2" style="font-size:20px"></label></div><div class="row"><button class="small" id="tm0">Testar café</button><button class="small" id="tm1">Testar almoço</button><button class="small" id="tm2">Testar janta</button></div><div class="row"><button class="small" id="voz">🗣️ Trocar voz</button></div><div class="row"><button class="small" id="clear">Limpar registro</button></div></div>
  </div>
  <div class="card" style="background:#fff"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px"><b style="font-size:22px">Próximos horários</b><button class="small" id="nextbtn" style="flex:none;background:#f57c00;color:#fff;font-weight:bold">🔔 Qual o próximo?</button></div><div id="next" style="font-size:20px;margin-top:6px"></div></div>
  <div class="card" style="background:#fff"><b style="font-size:22px">Registro da semana</b>
    <div id="log" style="margin-top:8px"></div>
    <div class="row"><button class="small" id="copy" style="background:#8e44ad;color:#fff;font-weight:bold">Enviar Resumo (WhatsApp)</button></div>
    <pre id="sum" style="white-space:pre-wrap;font-size:16px"></pre>
  </div>
  <div class="row" style="margin:12px 0"><div id="callbtn" role="button"><span>📞 Ligar para Anne Filha!</span><span class="spk" id="spkcall">🔊</span></div></div>
  <div id="foot" style="text-align:center;font-size:12px;color:#666;margin:14px 0 24px">Desenvolvido por Danilo Tássio 2026</div>
</div>
<script>
var NATIVE=(typeof Android!=="undefined");
var timeOff=0;
function nowD(){return new Date(Date.now()+timeOff)}
var POTS=[
 {t:"06:00",n:"AMARELO",c:"#FFF2A8",m:["Omeprazol 20 mg — 2 comprimidos (em jejum) — protege o estômago","Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)","Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases","Dexametasona 4 mg — 1 comprimido (com o café) — apetite e dor"],q:1},
 {t:"10:00",n:"VERDE",c:"#BFE3BF",m:["Morfina 10 mg — 1 comprimido — dor"]},
 {t:"12:00",n:"LARANJA",c:"#FFD3A1",m:["Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"14:00",n:"AZUL",c:"#B7D3F5",m:["Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)"],q:1},
 {t:"18:00",n:"ROSA",c:"#F9C6E0",m:["Morfina 10 mg — 1 comprimido — dor","Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"22:00",n:"ROXO",c:"#D8C4EE",m:["Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)","Bisacodil 5 mg — 1 comprimido — intestino (laxante)"],q:1},
 {t:"00:00",n:"CINZA",c:"#D0D0D0",m:["Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"02:00",n:"VERMELHO",c:"#F8B4B4",m:["Morfina 10 mg — 1 comprimido — dor"]}
];
var QT=["Ondansetrona 8 mg — 1 comprimido — enjoo","Metoclopramida — 40 gotas — enjoo"];
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var passCb=null,passWant="";
function askPass(want,title,cb){passWant=want;passCb=cb;$("pwt").textContent=title;$("pwt").style.color="";$("pwi").value="";$("pw").style.display="flex";setTimeout(function(){$("pwi").focus()},100)}
function passDone(){var v=$("pwi").value;if(v===passWant){$("pw").style.display="none";passCb&&passCb()}else{$("pwt").textContent="Senha incorreta";$("pwt").style.color="#c5221f";$("pwi").value="";$("pwi").focus()}}
function aviso(t){$("warnt").textContent=t;$("warnl").innerHTML="";$("warn").style.display="flex"}
var mem={log:[],qt:false};
try{mem.log=JSON.parse(ls("log")||"[]");mem.qt=ls("qt")==="1"}catch(e){}
$("qt").checked=mem.qt;
$("qt").onclick=function(e){e.preventDefault();var cb=this;askPass("1989","Senha para pós-quimio",function(){cb.checked=!cb.checked;mem.qt=cb.checked;ls("qt",cb.checked?"1":"0");ls("qtS",cb.checked?isoToday():"");render();qtCheck()})};
$("spkqt").onclick=function(){dizer(mem.qt?"Dias pós-quimio, incluir remédios de enjoo. Hoje é o "+["","primeiro","segundo","terceiro"][qtDay()]+" dia após a quimio, Lourdinha.":"Dias pós-quimio, incluir remédios de enjoo. Desligado, Lourdinha.")};
function isoToday(){var d=nowD();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function qtDay(){var s=ls("qtS");if(!s)return 0;var a=s.split("-"),st=new Date(+a[0],+a[1]-1,+a[2]),n=nowD(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((t-st)/864e5)+1}
function qtCheck(){
  if(mem.qt){var d=qtDay();if(d===0){ls("qtS",isoToday());d=1}
    if(d>3){mem.qt=false;ls("qt","0");ls("qtS","");$("qt").checked=false;render()}}
  $("qtd").textContent=mem.qt?qtDay()+"º dia após quimio":"";
}
var spk=null;
function falar(p){
  if(NATIVE||!sndOn())return;
  if(Date.now()-lastDz<20000)return;
  try{
    var u=mkU("Bora, Lourdinha! Tomar o remédio da bolsa "+p.n.toLowerCase()+"!");u.volume=1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
var ac=null,playing=null,pending=null,fired={},musicVol=1,lastDz=0,mealPending=null;
function pad(n){return (n<10?"0":"")+n}
function hhmm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function dstr(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
// melodia suave original (loop)
var NOTES=[523,659,784,659,587,698,880,698,523,659,784,1047,784,659,587,523];
function startMusic(){
  if(NATIVE||!sndOn())return;
  stopMusic();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  var i=0;
  function tick(){
    try{
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="square";o.frequency.value=NOTES[i%NOTES.length];
      g.gain.setValueAtTime(0,ac.currentTime);
      g.gain.linearRampToValueAtTime(.9*musicVol,ac.currentTime+.05);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.75);
    }catch(e){}
    i++;
    try{if(navigator.vibrate&&i%4==0)navigator.vibrate([300,150,300])}catch(e){}
  }
  tick();playing=setInterval(tick,600);
}
function stopMusic(){if(playing){clearInterval(playing);playing=null}}
$("stop").onclick=function(){if(NATIVE)Android.stop();stopMusic();clearInterval(spk);try{speechSynthesis.cancel()}catch(e){}};
function sndOn(){return NATIVE?Android.getSound():ls("snd")!=="0"}
function paintSnd(){$("enable").textContent=sndOn()?"🔔 Som do alarme: LIGADO (tocar para desligar)":"🔕 Som do alarme: DESLIGADO (tocar para ligar)"}
$("enable").onclick=function(){
  var on=!sndOn();
  if(NATIVE)Android.setSound(on);else ls("snd",on?"1":"0");
  if(on){
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
    paintSnd();startMusic();setTimeout(stopMusic,1200);
  }else{stopMusic();clearInterval(spk);try{speechSynthesis.cancel()}catch(e){}paintSnd()}
};
paintSnd();
function mealsOn(){return NATIVE?Android.getMeals():ls("meals")!=="0"}
function paintMealsSw(){$("mealsw").textContent=mealsOn()?"🍽️ Despertadores de refeições: LIGADOS (tocar para desligar)":"🍽️ Despertadores de refeições: DESLIGADOS (tocar para ligar)"}
$("mealsw").onclick=function(){var on=!mealsOn();if(NATIVE)Android.setMeals(on);else ls("meals",on?"1":"0");paintMealsSw()};
paintMealsSw();
// horários das refeições
function initMealTimes(){
  var saved=NATIVE?(Android.getMealTimes?String(Android.getMealTimes()).split(","):[]):[];
  MEALS.forEach(function(M,i){
    var v=NATIVE?saved[i]:ls("mt"+i);if(v&&/^\d\d:\d\d$/.test(v))M.t=v;
    var el=$("mt"+i);el.value=M.t;
    el.onchange=function(){if(!/^\d\d:\d\d$/.test(el.value)){el.value=M.t;return}M.t=el.value;ls("mt"+i,M.t);if(NATIVE)Android.setMealTime(i,M.t);aviso("Horário do "+M.n.toLowerCase()+" salvo: "+M.t)}
  });
}
// fonte da hora: telefone ou internet
function paintTsrc(){$("tsrc").textContent=ls("tsrc")==="net"?"🌐 Hora: INTERNET (tocar para usar a do telefone)":"📱 Hora: TELEFONE (tocar para usar a da internet)"}
function syncNet(){
  if(ls("tsrc")!=="net"){timeOff=0;return Promise.resolve(true)}
  var urls=["https://worldtimeapi.org/api/timezone/America/Recife","https://timeapi.io/api/Time/current/zone?timeZone=America/Recife"];
  function go(i){
    if(i>=urls.length||typeof fetch==="undefined")return Promise.resolve(false);
    var t0=Date.now();
    return fetch(urls[i]).then(function(r){return r.json()}).then(function(j){
      var ms=j.unixtime?j.unixtime*1000:(j.dateTime?Date.parse(j.dateTime+"Z")-(-3*36e5):NaN);
      if(isNaN(ms))throw 0;timeOff=ms+(Date.now()-t0)/2-Date.now();return true
    }).catch(function(){return go(i+1)});
  }
  return go(0);
}
$("tsrc").onclick=function(){
  var net=ls("tsrc")!=="net";ls("tsrc",net?"net":"tel");paintTsrc();
  syncNet().then(function(ok){if(net&&!ok){ls("tsrc","tel");timeOff=0;paintTsrc();aviso("Sem internet. Usando a hora do telefone.")}});
};
paintTsrc();syncNet();setInterval(syncNet,1800000);
$("voz").onclick=function(){
  var n=0;
  if(NATIVE){n=Android.nextVoice()}
  else{try{var vs=pvoices();if(vs.length){var k=+ls("voice")||0;k=(k+1)%vs.length;ls("voice",String(k));n=k+1}}catch(e){}}
  if(!n){aviso("Nenhuma voz em português encontrada neste aparelho.");return}
  dizer("Oi Lourdinha, esta é a voz número "+n+". Tudo bem com você?");
};
$("pwo").onclick=passDone;$("pwc").onclick=function(){$("pw").style.display="none"};
$("gear").onclick=function(){askPass("1989","Senha para opções",function(){var a=$("adm");a.style.display=a.style.display==="none"?"block":"none"})};
$("test").onclick=function(){if(NATIVE){Android.test();fire(POTS[0],true)}else fire(POTS[0],true)};
function pvoices(){var a=speechSynthesis.getVoices().filter(function(v){return /pt[-_]BR/i.test(v.lang)});a.sort(function(x,y){return (y.localService?1:0)-(x.localService?1:0)||(/natural|neural|google|luciana|francisca/i.test(y.name)?1:0)-(/natural|neural|google|luciana|francisca/i.test(x.name)?1:0)});return a}
function mkU(t){var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.pitch=1;u.rate=.9;try{var vs=pvoices();if(vs.length)u.voice=vs[(+ls("voice")||0)%vs.length]}catch(e){}return u}
function dizer(t){if(NATIVE){Android.speak(t)}else{try{musicVol=.1;lastDz=Date.now();var u=mkU(t);u.onend=u.onerror=function(){musicVol=1;lastDz=Date.now()};speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
function medSay(m){var a=m.split(" — ");var n=a[0].replace(/\s+\d+([.,]\d+)?\s*mg$/i,"");var q=(a[1]||"").replace(/\(.*?\)/g,"");if(/lactulona/i.test(n))q+=", um copinho e meio, Lourdinha";return n+", "+q}
function shortName(m){return m.split(" — ")[0].replace(/\s+\d+([.,]\d+)?\s*mg$/i,"")}
function medsOf(p){var a=p.m.slice();if(mem.qt&&p.q)a=a.concat(QT);return a}
function fire(p,test){
  pending={p:p,test:!!test,day:dstr(nowD()),time:p.t};
  startMusic();falar(p);
  clearInterval(spk);spk=setInterval(function(){if(pending)falar(pending.p)},9000);
  render();
}
function showMsg(p,r){
  var t=r==="retry"?"Tem certeza que não tomou, Lourdinha? Vou chamar de novo em 10 minutos.":"Tudo bem, Lourdinha. Registrei que não conseguiu tomar.";
  $("now").innerHTML='<div class="ov" style="background:'+p.c+'"><div class="big">BOLSA '+p.n+'</div><div class="med" style="text-align:center;font-size:36px;margin-top:30px">'+t+'</div><div class="btns"><button id="mok" style="background:#1F3864">OK</button></div></div>';
  $("mok").onclick=function(){render()};
  dizer(t);
}
function medsResult(){
  var ms=medsOf(pending.p),tk=pending.tk||{};
  return ms.map(function(m,k){var n=m.split(" — ")[0];return tk[k]==="a"?{n:n,ok:false,a:true}:{n:n,ok:true}});
}
function missingMeds(){var tk=pending.tk||{};return medsOf(pending.p).filter(function(m,k){return !tk[k]})}
function getOut(){try{return JSON.parse(ls("out")||"{}")}catch(e){return {}}}
function renderOut(){
  var o=getOut(),ks=Object.keys(o);
  $("outcard").style.display=ks.length?"block":"none";
  $("outl").innerHTML=ks.map(function(n,i){return '<div class="medrow" style="margin:8px 0"><div class="med" style="margin:0;flex:1;font-weight:bold;color:#c5221f">'+n+'</div><button class="small" data-n="'+i+'">✔ Comprei</button></div>'}).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#outl button"),function(b){b.onclick=function(){var x=getOut();delete x[ks[+b.dataset.n]];ls("out",JSON.stringify(x));renderOut()}});
}
$("shout").onclick=function(){
  var ks=Object.keys(getOut());if(!ks.length)return;
  var t="*Remédios para comprar — Lourdinha*\n\n"+ks.map(function(n){return "• "+n}).join("\n");

}
