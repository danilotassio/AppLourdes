<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remédios da Lourdinha</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#111;min-height:100vh}
#top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#1F3864;color:#fff;font-size:18px}
#clock{font-size:26px;font-weight:bold}
#main{padding:12px}
.card{border-radius:18px;padding:18px;margin-bottom:12px;border:4px solid rgba(0,0,0,.25)}
.big{font-size:44px;font-weight:bold;text-align:center;margin:4px 0}
.sub{font-size:22px;text-align:center;margin-bottom:8px}
.med{font-size:30px;margin:10px 0;line-height:1.15}
.btns{display:flex;gap:10px;margin-top:14px}
button{border:0;border-radius:16px;font-size:30px;font-weight:bold;padding:22px 8px;flex:1;color:#fff}
#ok{background:#1e8e3e}#no{background:#c5221f}
.small{font-size:18px;padding:12px;background:#ddd;color:#111;border-radius:12px;font-weight:normal}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label{font-size:20px;display:flex;align-items:center;gap:10px}
input[type=checkbox]{width:28px;height:28px}
table{width:100%;border-collapse:collapse;font-size:18px;background:#fff}
td,th{border:1px solid #999;padding:6px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:bold}
#alarmbar{display:none}
#gear{background:none;color:#fff;font-size:26px;padding:0 8px;flex:none}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;overflow:auto;padding:14px;z-index:50}
.spk{background:#1F3864;color:#fff;font-size:26px;padding:6px 12px;border-radius:12px;flex:none;margin-right:8px}
.medrow{display:flex;align-items:center;margin:12px 0}
#pw{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:99;align-items:center;justify-content:center}
#pw div.b{background:#fff;border-radius:18px;padding:20px;width:85%}
#pwi{font-size:34px;width:100%;padding:10px;text-align:center}
</style>
</head>
<body>
<div id="top"><div>Remédios da Lourdinha</div><div style="display:flex;align-items:center"><button id="gear">⚙</button><div id="clock">--:--</div></div></div>
<div id="pw"><div class="b"><div class="sub" id="pwt">Senha</div><input id="pwi" type="password" inputmode="numeric"><div class="btns"><button class="small" id="pwc" style="flex:1">Cancelar</button><button id="pwo" style="background:#1F3864;flex:1;font-size:24px">OK</button></div></div></div>
<div id="main">
  <div id="sound" class="card" style="background:#fff3cd"><div class="sub"><b>1) Toque aqui para ligar o som</b></div><button id="enable" style="background:#1F3864;width:100%">🔔 Ligar alarme</button><div style="font-size:16px;margin-top:8px">Deixe esta tela aberta e o volume alto. O alarme toca nos horários dos remédios.</div></div>
  <div id="now"></div>
  <div class="card" style="background:#fff">
    <label><input type="checkbox" id="qt"> Dias pós-quimio (incluir remédios de enjoo)</label>
    <div id="adm" style="display:none"><div class="row"><button class="small" id="test">Testar alarme</button><button class="small" id="stop">Parar música</button></div></div>
  </div>
  <div class="card" style="background:#fff"><b style="font-size:22px">Próximos horários</b><div id="next" style="font-size:20px;margin-top:6px"></div></div>
  <div class="card" style="background:#fff"><b style="font-size:22px">Registro da semana</b>
    <div id="log" style="margin-top:8px"></div>
    <div class="row"><button class="small" id="copy">Copiar resumo (WhatsApp)</button><button class="small" id="clear">Limpar registro</button></div>
    <pre id="sum" style="white-space:pre-wrap;font-size:16px"></pre>
  </div>
</div>
<script>
var NATIVE=(typeof Android!=="undefined");
var POTS=[
 {t:"06:00",n:"AMARELO",c:"#FFF2A8",m:["Omeprazol 20 mg — 2 comprimidos (em jejum) — protege o estômago","Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)","Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases","Dexametasona 4 mg — 1 comprimido (com o café) — apetite e dor"],q:1},
 {t:"10:00",n:"VERDE",c:"#BFE3BF",m:["Morfina 10 mg — 1 comprimido — dor"]},
 {t:"12:00",n:"LARANJA",c:"#FFD3A1",m:["Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"14:00",n:"AZUL",c:"#B7D3F5",m:["Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)"],q:1},
 {t:"18:00",n:"ROSA",c:"#F9C6E0",m:["Morfina 10 mg — 1 comprimido — dor","Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"22:00",n:"ROXO",c:"#D8C4EE",m:["Morfina 10 mg — 1 comprimido — dor","Lactulona — 15 ml — intestino (laxante)","Bisacodil 5 mg — 1 comprimido — intestino (laxante)"],q:1},
 {t:"00:00",n:"CINZA",c:"#D0D0D0",m:["Dipirona 500 mg — 2 comprimidos — dor e febre","Simeticona — 40 gotas — gases"]},
 {t:"02:00",n:"VERMELHO",c:"#F8B4B4",m:["Morfina 10 mg — 1 comprimido — dor"]}
];
var QT=["Ondansetrona 8 mg — 1 comprimido — enjoo","Metoclopramida — 40 gotas — enjoo"];
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var passCb=null,passWant="";
function askPass(want,title,cb){passWant=want;passCb=cb;$("pwt").textContent=title;$("pwi").value="";$("pw").style.display="flex";setTimeout(function(){$("pwi").focus()},100)}
function passDone(){var v=$("pwi").value;$("pw").style.display="none";if(v===passWant){passCb&&passCb()}else{alert("Senha incorreta")}}
var mem={log:[],qt:false};
try{mem.log=JSON.parse(ls("log")||"[]");mem.qt=ls("qt")==="1"}catch(e){}
$("qt").checked=mem.qt;
$("qt").onchange=function(){mem.qt=this.checked;ls("qt",this.checked?"1":"0");render()};
var spk=null;
function falar(p){
  if(NATIVE)return;
  try{
    var u=new SpeechSynthesisUtterance("Bora, Lourdinha! Tomar o remédio da bolsa "+p.n.toLowerCase()+"!");
    u.lang="pt-BR";u.volume=1;u.rate=.9;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
var ac=null,playing=null,pending=null,fired={};
function pad(n){return (n<10?"0":"")+n}
function hhmm(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function dstr(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
// melodia suave original (loop)
var NOTES=[523,659,784,659,587,698,880,698,523,659,784,1047,784,659,587,523];
function startMusic(){
  if(NATIVE)return;
  stopMusic();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  var i=0;
  function tick(){
    try{
      var o=ac.createOscillator(),g=ac.createGain();
      o.type="square";o.frequency.value=NOTES[i%NOTES.length];
      g.gain.setValueAtTime(0,ac.currentTime);
      g.gain.linearRampToValueAtTime(.9,ac.currentTime+.05);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.75);
    }catch(e){}
    i++;
    try{if(navigator.vibrate&&i%4==0)navigator.vibrate([300,150,300])}catch(e){}
  }
  tick();playing=setInterval(tick,600);
}
function stopMusic(){if(playing){clearInterval(playing);playing=null}}
$("stop").onclick=function(){if(NATIVE)Android.stop();stopMusic();clearInterval(spk);try{speechSynthesis.cancel()}catch(e){}};
$("enable").onclick=function(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
  $("sound").style.display="none";startMusic();setTimeout(stopMusic,1200);
};
$("pwo").onclick=passDone;$("pwc").onclick=function(){$("pw").style.display="none"};
$("gear").onclick=function(){askPass("1989","Senha para opções",function(){var a=$("adm");a.style.display=a.style.display==="none"?"block":"none"})};
$("test").onclick=function(){if(NATIVE){Android.test();fire(POTS[0],true)}else fire(POTS[0],true)};
function dizer(t){if(NATIVE){try{Android.hush()}catch(e){}Android.speak(t)}else{try{var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.pitch=.6;u.rate=.9;var vs=speechSynthesis.getVoices().filter(function(v){return /pt/i.test(v.lang)&&/male|masc|daniel|felipe|ricardo/i.test(v.name)&&!/female|fem/i.test(v.name)});if(vs.length)u.voice=vs[0];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
function medSay(m){var a=m.split(" — ");var n=a[0].replace(/\s+\d+([.,]\d+)?\s*mg$/i,"");var q=(a[1]||"").replace(/\(.*?\)/g,"");return n+", "+q}
function medsOf(p){var a=p.m.slice();if(mem.qt&&p.q)a=a.concat(QT);return a}
function fire(p,test){
  pending={p:p,test:!!test,day:dstr(new Date()),time:p.t};
  startMusic();falar(p);
  clearInterval(spk);spk=setInterval(function(){if(pending)falar(pending.p)},9000);
  render();
}
function showMsg(p,r){
  var t=r==="retry"?"Tem certeza que não tomou, Lourdinha? Vou chamar de novo em 10 minutos.":"Tudo bem, Lourdinha. Registrei que não conseguiu tomar.";
  $("now").innerHTML='<div class="ov" style="background:'+p.c+'"><div class="big">BOLSA '+p.n+'</div><div class="med" style="text-align:center;font-size:36px;margin-top:30px">'+t+'</div><div class="btns"><button id="mok" style="background:#1F3864">OK</button></div></div>';
  $("mok").onclick=function(){render()};
  dizer(t);
}
function answer(ok){
  if(NATIVE){
    if(pending&&!pending.test){
      var r=Android.answer(ok,pending.time);
      if(!ok&&(r==="retry"||r==="final")){showMsg(pending.p,r);pending=null;renderLog();return}
    }else Android.stop();
    pending=null;render();renderLog();return;
  }
  stopMusic();clearInterval(spk);try{speechSynthesis.cancel()}catch(e){}
  if(!pending)return;
  if(!ok&&!pending.test){
    var at=(pending.att||0)+1;
    if(at<3){var pp=pending.p;showMsg(pp,"retry");var dd=pending;pending=null;setTimeout(function(){fire(dd.p,false);pending.att=at},600000);renderLog();return}
  }
  if(!pending.test){mem.log.push({d:pending.day,t:pending.time,ok:ok,n:pending.p.n});ls("log",JSON.stringify(mem.log))}
  pending=null;render();renderLog();
}
function render(){
  var h="";
  if(pending){
    var p=pending.p;
    h+='<div class="ov" style="background:'+p.c+'"><div class="big">BOLSA '+p.n+'</div><div class="sub">'+p.t+(pending.test?" (teste)":"")+'</div>';
    medsOf(p).forEach(function(m,k){h+='<div class="medrow"><button class="spk" data-k="'+k+'">🔊</button><div class="med" style="margin:0">'+m+'</div></div>'});
    h+='<div class="btns"><button id="ok">✅ Tomei tudo</button><button id="no">❌ Não consegui</button></div></div>';
  }else{
    h+='<div class="card" style="background:#fff"><div class="sub">Nenhum remédio agora. Quando chegar a hora, a música toca e mostra a cor da bolsa.</div></div>';
  }
  $("now").innerHTML=h;
  if(pending){var ms=medsOf(pending.p);Array.prototype.forEach.call(document.querySelectorAll(".spk"),function(b){b.onclick=function(){dizer(medSay(ms[+b.dataset.k]))}})}
  if($("ok")){$("ok").onclick=function(){answer(true)};$("no").onclick=function(){answer(false)}}
}
function renderNext(){
  var now=new Date(),cur=now.getHours()*60+now.getMinutes(),arr=POTS.map(function(p){var s=p.t.split(":");var m=+s[0]*60+ +s[1];return {p:p,d:(m-cur+1440)%1440}}).sort(function(a,b){return a.d-b.d}).slice(0,3);
  $("next").innerHTML=arr.map(function(x){return '<div style="margin:4px 0"><span class="pill" style="background:'+x.p.c+'">'+x.p.t+' — '+x.p.n+'</span></div>'}).join("");
}
function getLogData(){
  if(NATIVE){try{return JSON.parse(Android.getLog())}catch(e){return []}}
  return mem.log;
}
function renderLog(){
  var data=getLogData();var rows=data.slice(-40).reverse().map(function(l){return "<tr><td>"+l.d+"</td><td>"+l.t+" "+l.n+"</td><td>"+(l.ok===true?"✅ tomou tudo":(l.ok===false?"❌ não conseguiu":"⏰ sem resposta"))+"</td></tr>"}).join("");
  $("log").innerHTML=rows?"<table><tr><th>Dia</th><th>Bolsa</th><th>Resultado</th></tr>"+rows+"</table>":"Sem registros ainda.";
  var by={};data.forEach(function(l){by[l.d]=by[l.d]||{ok:0,no:0,fails:[]};if(l.ok===true)by[l.d].ok++;else{by[l.d].no++;by[l.d].fails.push(l.t)}});
  var s="Resumo remédios da Lourdinha:\n";Object.keys(by).forEach(function(d){s+=d+": "+by[d].ok+" ok, "+by[d].no+" não"+(by[d].no?" ("+by[d].fails.join(", ")+")":"")+"\n"});
  $("sum").textContent=data.length?s:"";
}
$("copy").onclick=function(){try{navigator.clipboard.writeText($("sum").textContent)}catch(e){}};
$("clear").onclick=function(){askPass("1988","Senha para limpar",function(){mem.log=[];ls("log","[]");if(NATIVE)Android.clearLog();renderLog()})};
setInterval(function(){
  var d=new Date();$("clock").textContent=hhmm(d);renderNext();
  var k=dstr(d)+hhmm(d);
  if(!NATIVE)POTS.forEach(function(p){if(p.t===hhmm(d)&&!fired[k+p.t]){fired[k+p.t]=1;fire(p)}});
},1000);
render();renderLog();renderNext();
(function(){
  if(NATIVE){
    $("sound").style.display="none";
    var pc=document.createElement("div");pc.className="card";pc.style.background="#fff";
    pc.innerHTML='<b style="font-size:22px">Permissões (fazer uma vez)</b><div style="font-size:17px;margin:6px 0">Toque em cada botão e permita:</div><div class="row"><button class="small" id="pn">1) Notificações</button><button class="small" id="pt">2) Tela cheia</button><button class="small" id="pb">3) Bateria sem restrição</button></div>';
    $("main").insertBefore(pc,$("now"));
    $("pn").onclick=function(){Android.openSetting("notif")};
    $("pt").onclick=function(){Android.openSetting("tela")};
    $("pb").onclick=function(){Android.openSetting("bateria")};
  }
  var m=/[?&]p=([0-9:]+)/.exec(location.search);
  var isTest=/[?&]test=1/.test(location.search);
  if(m){POTS.forEach(function(p){if(p.t===m[1]){setTimeout(function(){fire(p,isTest)},300)}})}
})();
</script>
</body>
</html>
